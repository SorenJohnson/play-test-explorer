<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Inspector</title>
  <link rel="stylesheet" href="report.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="play.html">Play</a>
      <a href="compare.html">Analytics</a>
      <a href="report.html">Report</a>
      <a href="flow.html">Flow</a>
    </nav>
    <header>
      <h1>Game Inspector</h1>
      <p class="subtitle" id="game-info">Loading...</p>
    </header>

    <section>
      <h2>Money, Debt & Net Worth Over Time</h2>
      <div class="chart-container wide" style="min-height:350px">
        <canvas id="networth-chart"></canvas>
      </div>
    </section>

    <section>
      <h2>Market Prices Over Time</h2>
      <div class="chart-container wide" style="min-height:350px">
        <canvas id="market-chart"></canvas>
      </div>
    </section>

    <section>
      <h2>Player Rates Over Time</h2>
      <div id="rate-charts"></div>
    </section>

    <section>
      <h2>Turn-by-Turn Log</h2>
      <div id="turn-log"></div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
