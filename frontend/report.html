<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Report</title>
  <link rel="stylesheet" href="report.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="play.html">Play</a>
      <a href="compare.html">Analytics</a>
      <a href="report.html" class="active">Report</a>
      <a href="flow.html">Flow</a>
    </nav>
    <header>
      <h1>Simulation Report</h1>
      <div id="config-summary"></div>
    </header>

    <section id="overview">
      <h2>Overview</h2>
      <div class="stat-cards" id="stat-cards"></div>
    </section>

    <section id="distributions">
      <h2>Outcome Distributions</h2>
      <div class="chart-row">
        <div class="chart-container">
          <canvas id="net-worth-chart"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="contracts-chart"></canvas>
        </div>
      </div>
    </section>

    <section id="buildings-section">
      <h2>Building Frequency</h2>
      <div class="chart-container wide">
        <canvas id="buildings-chart"></canvas>
      </div>
    </section>

    <section id="market-section">
      <h2>Final Market Prices</h2>
      <div class="chart-container wide">
        <canvas id="market-chart"></canvas>
      </div>
    </section>

    <section id="rates-section">
      <h2>Final Resource Rates</h2>
      <div class="chart-container wide">
        <canvas id="rates-chart"></canvas>
      </div>
    </section>

    <section id="games-section">
      <h2>Individual Games</h2>
      <div class="table-scroll">
        <table id="games-table">
          <thead>
            <tr>
              <th>Game</th>
              <th>Net Worth</th>
              <th>Money</th>
              <th>Debt</th>
              <th>Contracts</th>
              <th>Buildings</th>
              <th>Turns</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="game-detail" style="display:none">
      <h2>Game Detail</h2>
      <div id="game-detail-content"></div>
    </section>
  </div>
  <script src="report.js"></script>
</body>
</html>
